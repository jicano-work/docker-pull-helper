name: Pull Docker Image
on: [workflow_dispatch]
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and Save
        run: |
          docker pull michaelkaye/recoll-webui:latest
          docker save michaelkaye/recoll-webui:latest -o recoll-webui.tar
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: recoll-webui-tar
          path: recoll-webui.tar
